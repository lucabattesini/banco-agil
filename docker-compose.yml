services:
  back-end:
    build: ./back-end
    env_file: ./back-end/.env
    environment:
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./back-end/app/data:/app/app/data

  front-end:
    build:
      context: ./front-end
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - back-end
